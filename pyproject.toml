[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strata_fit_v6_meta_algo_py"
version = "0.1.0"
description = "Meta‑algorithm orchestrating STRATA‑FIT v6 data validation, imputation, and federated logistic regression."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "Strata-Fit Team"}]
dependencies = [
    "pandas>=2.1.4",
    "polars>=1.0.0",
    "vantage6-algorithm-tools>=4.13.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.10",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["strata_fit_v6_meta_algo_py*"]
